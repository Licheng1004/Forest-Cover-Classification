name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Notebook and runtime smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Validate notebook files and code syntax
        run: python .github/scripts/validate_notebooks.py
      - name: Run data-independent smoke check
        run: python scripts/ci_smoke.py

  release:
    name: Publish versioned project release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish report assets with the source release
        run: gh release create "$GITHUB_REF_NAME" report/final_report.pdf --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
